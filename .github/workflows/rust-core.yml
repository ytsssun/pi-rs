name: Rust core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/pi-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test deterministic runtime contracts
        run: cargo +stable test --locked --all-targets
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
