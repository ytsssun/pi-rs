name: pi-rs CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.85.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.19.0' }
      - name: Bootstrap pinned upstream compatibility checkout
        run: sh scripts/bootstrap-upstream.sh --build
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test experiments/custom-provider-stream.test.mjs
      - name: Build native Node-API addon
        run: python3 scripts/build-native-session.py
      - name: Verify native session identity and timestamps
        run: node experiments/session-identity.mjs
      - name: Verify native CLI command acceptance
        run: node --experimental-strip-types experiments/command-invocation.mjs
      - name: Verify native command idle lifecycle
        run: node --experimental-strip-types experiments/command-idle.mjs
      - name: Verify native blocked tool hook acceptance
        run: |
          node experiments/native-batch-hook-abort.mjs
          node experiments/native-preflight-results.mjs
          node experiments/native-batch-input-mutation.mjs
      - name: Verify formal CLI lifecycle
        run: |
          node --experimental-strip-types experiments/cli-lifecycle.mjs
          node --experimental-strip-types experiments/cli-agent-start.mjs
          node --experimental-strip-types experiments/native-start-lifecycle.mjs
          node --experimental-strip-types experiments/turn-end-lifecycle.mjs
          node --experimental-strip-types experiments/upstream-agent-end.mjs
          node --experimental-strip-types experiments/agent-end-lifecycle.mjs
          node --experimental-strip-types experiments/cli-agent-end.mjs
      - name: Verify startup measurement executes actual CLI
        run: |
          cargo build --locked --bin pi-rs
          python3 scripts/measure-startup.py --binary "$PWD/target/debug/pi-rs" --samples 2 --warmups 0
      - name: Verify formal CLI command then input
        run: node --experimental-strip-types experiments/cli-command-input.mjs
      - name: Verify persisted session replacement and failure cleanup
        run: |
          node --experimental-strip-types experiments/cli-new-session.mjs
          node --experimental-strip-types experiments/cli-switch-session.mjs
          node --experimental-strip-types experiments/cli-fork-session.mjs
          node --experimental-strip-types experiments/cli-switch-provider.mjs
          node --experimental-strip-types experiments/session-owner-failures.mjs
          node --experimental-strip-types experiments/with-session-contract.mjs
      - name: Verify parent session metadata compatibility
        run: node --experimental-strip-types experiments/session-parent-option.mjs
      - name: Verify deferred non-trigger custom message persistence
        run: node --experimental-strip-types experiments/deferred-custom-message.mjs
      - name: Verify nextTurn FIFO and subprocess recovery
        run: node --experimental-strip-types experiments/next-turn-queue.mjs
      - name: Staged custom message lifecycle
        run: node --experimental-strip-types experiments/pending-lifecycle.mjs
      - name: Native dispatch budget boundaries
        run: |
          node --experimental-strip-types experiments/dispatch-budget.mjs
          node --experimental-strip-types experiments/dispatch-followup-differential.mjs
      - name: User follow-up execution
        run: node --experimental-strip-types experiments/user-followup-execution.mjs
      - name: Upstream and native user queue modes
        run: node --experimental-strip-types experiments/user-queue-modes.mjs
      - name: Sequential tool boundary steering and cancellation
        run: |
          node --experimental-strip-types experiments/tool-boundary-steering.mjs
          node --experimental-strip-types experiments/tool-steer-cancel.mjs
          node --experimental-strip-types experiments/parallel-batch-steering.mjs
      - name: Native user steer boundary
        run: node --experimental-strip-types experiments/user-steer-execution.mjs
      - name: Registered provider CLI
        run: node --experimental-strip-types experiments/cli-registered-provider.mjs
      - name: Prompt lifecycle unchanged pirate extension
        run: node --experimental-strip-types experiments/cli-before-agent-start.mjs
      - name: Project instructions in formal CLI
        run: node --experimental-strip-types experiments/cli-project-instructions.mjs
      - name: System prompt resource compatibility
        run: node --experimental-strip-types experiments/cli-system-resources.mjs
      - name: Core inventory report consistency
        run: python3 scripts/report-core-parity.py --check
      - name: Verify deferred custom session event ordering
        run: node --experimental-strip-types experiments/deferred-message-events.mjs
      - name: Verify cooperative sequential tool cancellation
        run: node --experimental-strip-types experiments/cooperative-tool-cancel.mjs
      - name: Active tool execution conformance
        run: |
          node --experimental-strip-types experiments/active-tool-enforcement.mjs
          node --experimental-strip-types experiments/disabled-tool-oracle.mjs
          node --experimental-strip-types experiments/cli-dynamic-tools.mjs
      - name: Formal CLI context hook mutation
        run: node --experimental-strip-types experiments/cli-context-hook.mjs
