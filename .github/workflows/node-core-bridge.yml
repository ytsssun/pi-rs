name: Node core bridge

on:
  push:
    branches: [main, codex/node-core-bridge]
    paths: ['crates/pi-core/**', 'crates/pi-core-node/**', '.github/workflows/node-core-bridge.yml']
  pull_request:
    branches: [main, codex/rust-core-foundation]
    paths: ['crates/pi-core/**', 'crates/pi-core-node/**', '.github/workflows/node-core-bridge.yml']

permissions:
  contents: read

jobs:
  bridge:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --manifest-path crates/pi-core-node/Cargo.toml --check
      - name: Lint
        run: cargo +stable clippy --locked --manifest-path crates/pi-core-node/Cargo.toml --all-targets -- -D warnings
      - name: Build bridge
        run: node crates/pi-core-node/build.mjs
      - name: Test Node bridge
        run: node --test crates/pi-core-node/bridge.test.mjs
