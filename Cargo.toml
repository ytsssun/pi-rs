[package]
name = "pi-rs"
version = "0.1.0"
edition = "2021"
default-run = "pi-rs"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
pi-rs-compat = { path = "compatibility" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
